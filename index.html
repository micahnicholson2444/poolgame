<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red &amp; Yellow — 8-Ball Pool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23161616%22/><circle cx=%2250%22 cy=%2250%22 r=%2218%22 fill=%22%23fff%22/><text x=%2250%22 y=%2258%22 font-size=%2224%22 text-anchor=%22middle%22>8</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ================= MENU ================= -->
  <section id="menu-screen">
    <div class="panel">

      <div id="pane-root" class="menu-pane">
        <h1 class="title">Reds &amp; Yellows</h1>
        <p class="subtitle">A pub table, wherever you are.</p>
        <div class="menu-stack">
          <button id="btn-play" class="btn">Play — create a table</button>
          <button id="btn-join" class="btn">Join — enter a code</button>
          <button id="btn-sandbox" class="btn secondary">Sandbox — practice solo</button>
        </div>
      </div>

      <div id="pane-creating" class="menu-pane hidden">
        <h1 class="title">Setting up…</h1>
        <div class="spinner"></div>
        <p id="create-status" class="status-line">Opening a table…</p>
        <button class="back-link">Cancel</button>
      </div>

      <div id="pane-waiting" class="menu-pane hidden">
        <h1 class="title">Your table is open</h1>
        <p class="subtitle">Give this code to the other player</p>
        <div class="room-code-display" id="room-code-text">— — — — —</div>
        <div class="spinner"></div>
        <p class="status-line">Waiting for them to join…</p>
        <button class="back-link">Cancel</button>
      </div>

      <div id="pane-join" class="menu-pane hidden">
        <h1 class="title">Join a table</h1>
        <p class="subtitle">Enter the code your friend gave you</p>
        <div class="field-row">
          <input type="text" id="join-code-input" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters">
        </div>
        <div class="menu-stack" style="margin-top:16px;">
          <button id="btn-join-submit" class="btn">Join table</button>
        </div>
        <button class="back-link">Back</button>
      </div>

      <div id="pane-joining" class="menu-pane hidden">
        <h1 class="title">Connecting…</h1>
        <div class="spinner"></div>
        <p id="join-status" class="status-line">Connecting…</p>
        <button class="back-link">Cancel</button>
      </div>

    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="game-screen" class="hidden">
    <div id="hud">
      <div class="player-chip" id="chip-0">
        <span class="chip-dot open"></span>
        <span class="chip-label">Player 1 — open</span>
      </div>
      <div id="center-message"></div>
      <div class="player-chip" id="chip-1">
        <span class="chip-dot open"></span>
        <span class="chip-label">Player 2 — open</span>
      </div>
    </div>

    <div id="table-wrap">
      <canvas id="table"></canvas>
      <div id="power-meter"><div id="power-fill"></div></div>
    </div>

    <div id="footer-controls">
      <button id="leave-btn" class="btn small secondary hidden">Leave table</button>
    </div>
  </section>

  <!-- ================= WINNER OVERLAY ================= -->
  <div id="winner-overlay" class="hidden">
    <div class="panel">
      <div id="winner-text">Player 1 wins!</div>
      <div id="winner-reason"></div>
      <div class="menu-stack">
        <button id="play-again-btn" class="btn">Play again</button>
        <button id="winner-menu-btn" class="btn secondary">Back to menu</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
</body>
</html>
